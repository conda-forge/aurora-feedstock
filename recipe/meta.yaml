{% set name = "aurora" %}
{% set version = "0.6.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aurora-{{ version }}.tar.gz
  sha256: edfa22acab4a63bd90cac1ea63a4ffbab16b9ff2ae3973df829c23ee4d3028f5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pytest-runner
    - python >=3.10
  run:
    - matplotlib-base
    - mt-metadata
    - mth5
    - mtpy-v2
    - numba
    - numpy
    - obspy
    - pandas
    - psutil
    - python >=3.10
    - scipy
    - xarray

test:
  imports:
    - aurora
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/simpeg/aurora
  summary: Processing Codes for Magnetotelluric Data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kkappler
    - kujaku11
    - lheagy
